name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_REF: origin/${{ github.base_ref || 'main' }}
  GITLEAKS_VERSION: 8.30.1

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/**'

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: >
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          | sudo tar -xz -C /usr/local/bin gitleaks
      - run: make secrets

  contract:
    name: api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make install contract

  backend:
    name: ${{ matrix.gate }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gate: format-lint, targets: lint}
          - {gate: complexity, targets: complexity}
          - {gate: types, targets: types}
          - {gate: tests-coverage, targets: test coverage}
          - {gate: dependencies, targets: deps}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/cache@v6
        if: matrix.gate == 'tests-coverage'
        with:
          path: backend/.coverage-base
          key: coverage-base-${{ github.event.pull_request.base.sha || github.sha }}
      - run: make install ${{ matrix.targets }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secrets, contract, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed, or was skipped by the path filter
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< '${{ toJSON(needs) }}'
