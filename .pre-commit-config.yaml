# The same gates as CI, through the same Makefile targets. Install with `make hooks`.
# Fast gates run on every commit, slow ones before a push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - {id: lint, name: format and lint, entry: make lint, language: system, pass_filenames: false, files: ^backend/}
      - {id: complexity, name: complexity and file length, entry: make complexity, language: system, pass_filenames: false, files: ^backend/}
      - {id: contract, name: OpenAPI schema is up to date, entry: make openapi, language: system, pass_filenames: false, files: ^backend/}
      - {id: types, name: strict types, entry: make types, language: system, pass_filenames: false, stages: [pre-push]}
      - {id: tests, name: tests and coverage, entry: make test coverage, language: system, pass_filenames: false, stages: [pre-push]}
      - {id: deps, name: lock file and vulnerability audit, entry: make deps, language: system, pass_filenames: false, stages: [pre-push]}
