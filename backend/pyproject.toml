[project]
name = "hroshyky"
version = "0.1.0"
description = "Personal expense tracker: backend, Telegram bot, receipts, Excel import"
requires-python = ">=3.14"
dependencies = [
    "tomli>=2.0.0",
    "fastapi>=0.163.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "DTZ", "ERA", "FIX", "PGH", "PL", "PT",
    "PTH", "RET", "RUF", "S", "SIM", "T20", "TID", "ASYNC", "ARG", "ANN",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests assert, and compare against literal expected values.
"tests/**" = ["S101", "PLR2004"]
# Command-line tools report to the terminal.
"scripts/**" = ["T20"]
"src/hroshyky/tools/**" = ["T20"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["src", "scripts"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
xfail_strict = true
filterwarnings = ["error"]
# Only local connections are allowed: no real network or LLM calls in tests.
addopts = "--strict-markers --allow-hosts=127.0.0.1,::1,localhost --cov --cov-report=xml --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src/hroshyky", "scripts"]
branch = true

[tool.coverage.report]
precision = 2

[dependency-groups]
dev = [
    "diff-cover>=11.0.2",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
    "urllib3==1.26.4",
]
